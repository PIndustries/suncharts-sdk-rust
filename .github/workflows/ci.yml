name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
permissions: { contents: read }
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
        with: { components: "clippy, rustfmt" }
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo package --locked --allow-dirty
  msrv:
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-toolchain
        with: { toolchain: "1.88" }
      - run: cargo check --locked
  secrets:
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks (full history)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 git --no-banner --redact /repo
  generated-up-to-date:
    # src/generated must be exactly what scripts/generate.sh produces from openapi.json.
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    steps:
      - uses: actions/checkout@v4
      - name: per-runner cache dir (runners share one $HOME on the fleet host)
        run: echo "XDG_CACHE_HOME=$RUNNER_TOOL_CACHE/xdg-cache" >> "$GITHUB_ENV"
      - uses: ./.github/actions/rust-toolchain
        with: { components: rustfmt }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: scripts/generate.sh
      - run: git status --porcelain && git diff --exit-code
