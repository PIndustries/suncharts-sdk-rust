name: release
# Tags main with the canonical version in ./VERSION (YY.MM.DD.<build-of-day>, no "v") when that tag is new.
on:
  push: { branches: [main], paths: [VERSION] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          v=$(cat VERSION)
          [[ $v =~ ^[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}\.[0-9]+$ ]] || { echo "::error::VERSION '$v' is not YY.MM.DD.N"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then echo "tag $v exists"; exit 0; fi
          git tag "$v" && git push origin "refs/tags/$v"
          echo "::notice::tagged $v"
